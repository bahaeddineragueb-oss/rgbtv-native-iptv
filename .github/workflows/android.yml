name: Android CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to mirror the APK and the build logs onto branches
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.10.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          sudo unzip -q gradle-8.10.2-bin.zip -d /opt
          sudo ln -sfn /opt/gradle-8.10.2/bin/gradle /usr/local/bin/gradle
          gradle --version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Prepare log directory
        run: mkdir -p ci-logs

      # Every Gradle step tees its output, so a failure can be inspected from the ci-logs branch
      # even when the Actions UI is not reachable.
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee ci-logs/assemble.log

      - name: Run unit tests
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee ci-logs/test.log

      - name: Lint (reports only, does not fail the build)
        run: |
          set -o pipefail
          gradle --no-daemon lintDebug 2>&1 | tee ci-logs/lint.log || true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: RGBTv-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      # Mirror the APK onto an orphan branch: artifact downloads expire and are not reachable
      # from every network, while a branch keeps a stable, always-downloadable copy.
      - name: Publish APK to the builds branch
        if: success()
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout --orphan builds
          git rm -rf --cached . > /dev/null 2>&1 || true
          cp "$APK" RGBTv-debug.apk
          git add -f RGBTv-debug.apk
          git commit -m "Debug APK from run ${{ github.run_number }} (${GITHUB_SHA::7})"
          git push -f origin builds || echo "::warning::Could not push the builds branch; the APK is still available as an artifact."

      - name: Publish build logs on failure
        if: failure()
        run: |
          set -e
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git fetch origin ci-logs || true
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null 2>&1 || true
          echo "run ${GITHUB_RUN_NUMBER} / ${GITHUB_SHA}" > ci-logs/info.txt
          git add -f ci-logs
          git commit -m "Build logs for run ${{ github.run_number }} (${GITHUB_SHA::7})"
          git push -f origin ci-logs || echo "::warning::Could not push the logs branch."
